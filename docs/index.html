<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アットインテリア 無料相談のご予約</title>
<style>
  :root {
    --main:#8a6a4f; --main-dark:#6f533c; --main-soft:#f3ede6;
    --text:#2f2a26; --sub:#7a716a; --line:#e7e0d8; --bg:#faf8f5; --card:#fff; --err:#c2410c;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif; line-height:1.7; }
  .wrap { max-width:640px; margin:0 auto; padding:28px 16px 56px; }
  .brand { font-size:13px; letter-spacing:.2em; color:var(--main); font-weight:600; }
  h1 { font-size:22px; margin:2px 0 6px; font-weight:600; }
  .lead { color:var(--sub); font-size:14px; margin:0 0 18px; }
  .steps { display:flex; gap:6px; list-style:none; padding:0; margin:0 0 18px; }
  .steps li { flex:1; text-align:center; font-size:12px; color:var(--sub); padding:6px 0; border-bottom:3px solid var(--line); }
  .steps li.on { color:var(--main-dark); border-color:var(--main); font-weight:600; }
  .steps li.done { color:var(--main); border-color:#cdb8a4; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; }
  h2 { font-size:16px; margin:0 0 12px; font-weight:600; }
  .dates { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; }
  .chip, .slot { border:1px solid var(--line); background:#fff; border-radius:10px; padding:8px 12px; font-size:14px; cursor:pointer; white-space:nowrap; color:var(--text); font-family:inherit; }
  .chip.on, .slot.on { background:var(--main); border-color:var(--main); color:#fff; }
  .slots { display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px; margin-top:12px; }
  label.f { display:block; font-size:14px; font-weight:600; margin:14px 0 6px; }
  .req { color:var(--err); font-size:11px; margin-left:6px; font-weight:600; }
  .opt-label { color:var(--sub); font-size:11px; margin-left:6px; font-weight:400; }
  input[type=text], input[type=email], input[type=tel], textarea { width:100%; font:inherit; font-size:16px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--text); }
  textarea { min-height:110px; resize:vertical; }
  input:focus, textarea:focus { outline:2px solid #d9c6b3; border-color:var(--main); }
  .picked { background:var(--main-soft); border-radius:10px; padding:10px 12px; font-size:14px; }
  fieldset { border:0; padding:0; margin:0 0 22px; }
  legend { font-size:15px; font-weight:600; margin-bottom:10px; padding:0; }
  .opts { display:flex; flex-wrap:wrap; gap:8px; }
  .opt { position:relative; cursor:pointer; }
  .opt input { position:absolute; opacity:0; pointer-events:none; }
  .opt span { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:14px; background:#fff; transition:background .15s, color .15s; }
  .opt input:checked + span { background:var(--main); border-color:var(--main); color:#fff; }
  .opt input:focus-visible + span { outline:2px solid #d9c6b3; outline-offset:2px; }
  button.submit { width:100%; margin-top:8px; padding:14px; font-size:16px; font-weight:600; border:0; border-radius:12px; background:var(--main); color:#fff; cursor:pointer; font-family:inherit; }
  button.submit:disabled { opacity:.45; cursor:default; }
  button.link { display:block; margin:14px auto 0; background:none; border:0; color:var(--sub); font-size:14px; text-decoration:underline; cursor:pointer; font-family:inherit; }
  .notice { background:var(--main-soft); border-color:transparent; font-size:14px; }
  .notice strong { font-size:16px; }
  .msg { color:var(--sub); font-size:14px; }
  .err { color:var(--err); font-size:14px; margin:12px 0 0; }
  .done { text-align:center; padding:36px 20px; }
  .done .big { width:56px; height:56px; border-radius:50%; background:var(--main); color:#fff; font-size:28px; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand" id="brand">アットインテリア</div>
  <h1 id="title">無料相談のご予約</h1>
  <p class="lead" id="lead"></p>
  <p class="msg" id="boot">読み込んでいます…</p>
  <ol class="steps hidden" id="steps">
    <li data-s="1">1. 日時を選ぶ</li>
    <li data-s="2">2. お客様情報</li>
    <li data-s="3">3. 事前アンケート</li>
  </ol>

  <!-- 予約 -->
  <section id="book-area" class="hidden">
    <div class="card">
      <h2>日時を選ぶ</h2>
      <div id="loading" class="msg">空き状況を読み込んでいます…</div>
      <div id="dates" class="dates"></div>
      <div id="slots" class="slots"></div>
    </div>

    <div class="card">
      <h2>お客様情報</h2>
      <div id="picked" class="picked hidden"></div>

      <label class="f" for="name">お名前<span class="req">必須</span></label>
      <input id="name" type="text" autocomplete="name" placeholder="山田 花子">

      <label class="f" for="email">メールアドレス<span class="req">必須</span></label>
      <input id="email" type="email" autocomplete="email" placeholder="example@mail.com">

      <label class="f" for="phone">電話番号<span class="opt-label">任意</span></label>
      <input id="phone" type="tel" autocomplete="tel" placeholder="090-1234-5678">

      <div id="book-error" class="err hidden"></div>
      <button id="book-submit" class="submit" style="margin-top:20px" disabled>この日時で予約する</button>
    </div>
  </section>

  <!-- 事前アンケート -->
  <section id="survey-area" class="hidden">
    <div class="card notice" id="survey-intro"></div>
    <div class="card">
      <h2>事前アンケート</h2>
      <p class="msg" style="margin-top:-6px">ご相談をより充実した時間にするため、簡単なアンケートにご協力ください（1分ほどで終わります）。</p>
      <form id="survey-form" onsubmit="return false"></form>
      <div id="survey-error" class="err hidden"></div>
      <button id="survey-submit" class="submit">アンケートを送信する</button>
      <button id="survey-later" class="link hidden">あとで回答する</button>
    </div>
  </section>

  <!-- 完了 -->
  <section id="done-area" class="card done hidden">
    <div class="big">✓</div>
    <h2 id="done-title"></h2>
    <p id="done-text" class="msg"></p>
  </section>
</div>

<script>
  // 予約の受付・記録を行う Google Apps Script のURL
  const API = 'https://script.google.com/macros/s/AKfycbxY_5P5gSoSeI71-rB8npXtuurKWuTDs4BiVKbBpm8xJnuBipQe_jRMwuKZgoZ9Q109/exec';

  const $ = (id) => document.getElementById(id);
  let DATA = null, days = [], selected = null, sending = false, booking = null;

  function unwrap(res) {
    return res.json().then(r => { if (!r.ok) throw new Error(r.error); return r.data; });
  }
  function apiGet(params) {
    return withTimeout(fetch(API + '?' + new URLSearchParams(params)).then(unwrap));
  }
  function withTimeout(p) {
    return Promise.race([p, new Promise((_, ng) => setTimeout(() => ng(new Error('timeout')), 30000))]);
  }
  function apiPost(body) {
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
    }).then(unwrap);
  }

  function show(id) {
    ['book-area', 'survey-area', 'done-area'].forEach(s => $(s).classList.toggle('hidden', s !== id));
    window.scrollTo(0, 0);
  }
  function setStep(n) {
    document.querySelectorAll('#steps li').forEach(li => {
      const s = Number(li.dataset.s);
      li.classList.toggle('on', s === n);
      li.classList.toggle('done', s < n);
    });
  }
  function errText(e) {
    return (e && e.message) ? e.message.replace(/^Error:\s*/, '') : '送信に失敗しました。時間をおいて再度お試しください。';
  }

  /* ---------- 予約 ---------- */

  let slotsRequest = null; // ページを開いた直後に先に読み込みを始めておく
  function loadSlots() {
    $('loading').classList.remove('hidden');
    $('loading').textContent = '空き状況を読み込んでいます…（数秒かかることがあります）';
    $('dates').innerHTML = ''; $('slots').innerHTML = '';
    const req = slotsRequest || apiGet({ api: 'slots' });
    slotsRequest = null;
    req
      .then(d => {
        days = d;
        if (!days.length) { $('loading').textContent = '現在ご予約いただける枠がありません。'; return; }
        $('loading').classList.add('hidden');
        renderDates(0);
      })
      .catch(() => { $('loading').textContent = '読み込みに失敗しました。ページを再読み込みしてください。'; });
  }

  function renderDates(active) {
    $('dates').innerHTML = '';
    days.forEach((d, i) => {
      const b = document.createElement('button');
      b.className = 'chip' + (i === active ? ' on' : '');
      b.textContent = d.label;
      b.onclick = () => renderDates(i);
      $('dates').appendChild(b);
    });
    renderSlots(days[active]);
  }

  function renderSlots(day) {
    $('slots').innerHTML = '';
    day.slots.forEach(s => {
      const b = document.createElement('button');
      b.className = 'slot' + (selected && selected.start === s.start ? ' on' : '');
      b.textContent = s.label;
      b.onclick = () => {
        selected = { start: s.start, text: day.label + ' ' + s.label + '〜' };
        renderSlots(day); setStep(2); updateBook();
      };
      $('slots').appendChild(b);
    });
  }

  function updateBook() {
    if (selected) { $('picked').textContent = '選択中の日時：' + selected.text; $('picked').classList.remove('hidden'); }
    else $('picked').classList.add('hidden');
    $('book-submit').disabled = sending || !selected || !$('name').value.trim() || !$('email').value.trim();
  }
  ['name', 'email', 'phone'].forEach(id => $(id).addEventListener('input', updateBook));

  $('book-submit').onclick = () => {
    sending = true; updateBook();
    $('book-submit').textContent = '送信中…';
    $('book-error').classList.add('hidden');
    apiPost({ action: 'book', form: { name: $('name').value, email: $('email').value, phone: $('phone').value, start: selected.start } })
      .then(r => {
        sending = false;
        booking = { id: r.id, name: r.name, when: r.when, answered: false, answers: {} };
        openSurvey(true);
      })
      .catch(e => {
        sending = false;
        $('book-submit').textContent = 'この日時で予約する';
        $('book-error').textContent = errText(e);
        $('book-error').classList.remove('hidden');
        if (/埋まって/.test($('book-error').textContent)) { selected = null; setStep(1); loadSlots(); }
        updateBook();
      });
  };

  /* ---------- 事前アンケート ---------- */

  function renderSurvey() {
    const form = $('survey-form');
    form.innerHTML = '';
    const prev = booking.answers || {};
    DATA.survey.forEach(q => {
      const fs = document.createElement('fieldset');
      const lg = document.createElement('legend');
      lg.textContent = q.label;
      const badge = document.createElement('span');
      badge.className = q.required ? 'req' : 'opt-label';
      badge.textContent = q.required ? '必須' : '任意';
      lg.appendChild(badge);
      fs.appendChild(lg);

      if (q.type === 'textarea') {
        const ta = document.createElement('textarea');
        ta.name = q.key;
        ta.placeholder = 'お部屋のこと、気になっていること、ご希望など自由にご記入ください';
        ta.value = prev[q.key] || '';
        fs.appendChild(ta);
      } else {
        const chosen = (prev[q.key] || '').split('、');
        const wrap = document.createElement('div');
        wrap.className = 'opts';
        q.options.forEach(o => {
          const lb = document.createElement('label');
          lb.className = 'opt';
          const inp = document.createElement('input');
          inp.type = q.type; inp.name = q.key; inp.value = o;
          inp.checked = chosen.indexOf(o) !== -1;
          const sp = document.createElement('span');
          sp.textContent = o;
          lb.appendChild(inp); lb.appendChild(sp);
          wrap.appendChild(lb);
        });
        fs.appendChild(wrap);
      }
      form.appendChild(fs);
    });
  }

  function collectSurvey() {
    const form = $('survey-form'), answers = {};
    for (const q of DATA.survey) {
      let v;
      if (q.type === 'checkbox') v = [...form.querySelectorAll('input[name="' + q.key + '"]:checked')].map(i => i.value);
      else if (q.type === 'radio') { const c = form.querySelector('input[name="' + q.key + '"]:checked'); v = c ? c.value : ''; }
      else v = form.querySelector('textarea[name="' + q.key + '"]').value.trim();
      if (q.required && (!v || !v.length)) throw new Error('「' + q.label + '」にご回答ください。');
      answers[q.key] = v;
    }
    return answers;
  }

  function openSurvey(justBooked) {
    setStep(3);
    const intro = $('survey-intro');
    intro.innerHTML = '';
    const head = document.createElement('strong');
    head.textContent = justBooked ? 'ご予約ありがとうございます' : booking.name + ' 様';
    const p = document.createElement('div');
    p.textContent = 'ご相談日時：' + booking.when;
    intro.appendChild(head); intro.appendChild(p);
    if (justBooked) {
      const m = document.createElement('div');
      m.className = 'msg';
      m.textContent = '確認メールをお送りしました。Zoomのリンクはメールに記載しています。';
      intro.appendChild(m);
    } else if (booking.answered) {
      const m = document.createElement('div');
      m.className = 'msg';
      m.textContent = 'アンケートは回答済みです。内容を修正して送り直すこともできます。';
      intro.appendChild(m);
    }
    $('survey-later').classList.toggle('hidden', !justBooked);
    renderSurvey();
    show('survey-area');
  }

  $('survey-submit').onclick = () => {
    $('survey-error').classList.add('hidden');
    let answers;
    try { answers = collectSurvey(); }
    catch (e) { $('survey-error').textContent = e.message; $('survey-error').classList.remove('hidden'); return; }
    $('survey-submit').disabled = true;
    $('survey-submit').textContent = '送信中…';
    apiPost({ action: 'survey', id: booking.id, answers: answers })
      .then(() => {
        done('ありがとうございました', 'アンケートを受け付けました。\n' + booking.when + ' にお話しできるのを楽しみにしております。');
      })
      .catch(e => {
        $('survey-submit').disabled = false;
        $('survey-submit').textContent = 'アンケートを送信する';
        $('survey-error').textContent = errText(e);
        $('survey-error').classList.remove('hidden');
      });
  };

  $('survey-later').onclick = () => {
    done('ご予約を承りました', booking.when + '\n確認メールにアンケートのURLを記載しています。ご相談日までにご回答いただけると助かります。');
  };

  function done(title, text) {
    document.querySelectorAll('#steps li').forEach(li => { li.classList.remove('on'); li.classList.add('done'); });
    $('done-title').textContent = title;
    $('done-text').innerText = text + '\n\nメールが届かない場合は、迷惑メールフォルダもご確認ください。';
    show('done-area');
  }

  /* ---------- 開始 ---------- */

  function start() {
    $('boot').classList.add('hidden');
    $('steps').classList.remove('hidden');
    $('brand').textContent = DATA.brand;
    $('title').textContent = DATA.title;
    booking = DATA.booking || null;
    if (DATA.mode === 'survey') {
      $('lead').textContent = '事前アンケートにご協力ください。';
      openSurvey(false);
    } else if (DATA.mode === 'notfound') {
      $('steps').classList.add('hidden');
      $('done-title').textContent = 'ご予約が見つかりませんでした';
      $('done-text').textContent = 'お手数ですが、確認メールに記載のURLから開き直してください。';
      $('done-area').querySelector('.big').textContent = '!';
      show('done-area');
    } else {
      $('lead').textContent = 'ご都合のよい日時をお選びください（' + DATA.slotMinutes + '分・Zoom）。ご予約のあとに簡単な事前アンケートがあります。';
      setStep(1);
      show('book-area');
      loadSlots();
    }
  }

  const params = new URLSearchParams(location.search);
  if (!params.get('id')) slotsRequest = apiGet({ api: 'slots' });
  apiGet(params.get('id') ? { api: 'init', id: params.get('id') } : { api: 'init' })
    .then(d => { DATA = d; start(); })
    .catch(() => { $('boot').textContent = '読み込みに失敗しました。時間をおいてページを再読み込みしてください。'; });
</script>
</body>
</html>
