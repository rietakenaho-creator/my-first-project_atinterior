<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ハウスワーク リッチメニュー</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@500;700&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
  /* LINE リッチメニュー（大）2500 x 1686px / 上1段 + 下3分割
     色はロゴ（黒・オレンジ・グレージュ）に合わせる */
  :root {
    --black: #231F1C;
    --orange: #F39800;
    --taupe: #7B6A56;
    --paper: #FAF8F5;
    --ink: #231F1C;
    --line: #E4DED6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 2500px; height: 1686px; background: var(--paper); }
  body {
    font-family: "Zen Kaku Gothic New", "IPAGothic", sans-serif;
    color: var(--ink);
    display: grid;
    grid-template-rows: 843px 843px;
  }
  .en { font-family: "Cormorant Garamond", serif; letter-spacing: .2em; }
  .mincho { font-family: "Shippori Mincho", "IPAGothic", serif; }

  /* ---- 上段：ハウスワークの家 ---- */
  .top { display: grid; grid-template-columns: 1250px 1250px; }
  .about {
    background: #FFFFFF; /* ロゴの背景色に合わせる */
    padding: 60px 90px 0 100px;
    display: flex; flex-direction: column;
  }
  .about .logo { height: 165px; width: auto; align-self: flex-start; }
  .about h1 {
    font-size: 132px; font-weight: 700; letter-spacing: .04em; line-height: 1.1;
    margin-top: 30px; white-space: nowrap;
  }
  .about h1::after {
    content: ""; display: block; width: 150px; height: 10px;
    background: var(--orange); margin-top: 26px;
  }
  .points {
    list-style: none; margin-top: 34px;
    display: grid; grid-template-columns: auto auto; column-gap: 50px; row-gap: 14px;
    font-size: 52px; font-weight: 700; white-space: nowrap;
  }
  .points li { display: flex; align-items: center; gap: 20px; }
  .points li::before {
    content: ""; width: 22px; height: 22px; background: var(--orange); flex: 0 0 auto;
    transform: rotate(45deg);
  }
  .points li.wide { grid-column: span 2; }

  .photo {
    position: relative;
    background: url("assets/amanoma_fukinuke.jpg") no-repeat;
    background-size: cover;
    background-position: center 40%;
  }
  .photo .more {
    position: absolute; right: 0; bottom: 70px;
    background: var(--black); color: #fff;
    font-size: 54px; font-weight: 700;
    padding: 26px 50px 26px 60px;
    display: flex; align-items: center; gap: 20px;
  }
  .photo .more svg { color: var(--orange); }

  /* ---- 下段：3分割 ---- */
  .bottom { display: grid; grid-template-columns: 833px 834px 833px; }
  .cell {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff;
  }
  .cell svg.icon { width: 190px; height: 190px; margin-bottom: 34px; }
  .cell .en { font-size: 54px; margin-bottom: 8px; }
  .cell h2 { font-size: 116px; font-weight: 700; letter-spacing: .04em; line-height: 1.15; }
  .cell p { font-size: 50px; margin-top: 24px; font-weight: 500; line-height: 1.4; }
  .cell .tag {
    margin-top: 30px; padding: 14px 38px; border-radius: 999px;
    font-size: 48px; font-weight: 700; letter-spacing: .03em;
  }

  .works { background: var(--black); }
  .works .en { color: var(--orange); }
  .works .tag { background: var(--orange); color: var(--black); }

  .voice { background: var(--taupe); }
  .voice .en { color: #F1E4D3; }
  .voice p { color: #F7EFE6; }
  .voice .tag { background: #FFFFFF; color: var(--taupe); }

  .reserve { background: var(--orange); color: var(--black); }
  .reserve .tag { background: var(--black); color: #fff; padding: 18px 56px; font-size: 52px; }
  /* 上段：項目は出さず、キャッチを1行で */
  .about { justify-content: center; padding-top: 0; }
  .about .lead { font-size: 66px; font-weight: 700; letter-spacing: .08em; margin-top: 44px; color: var(--ink); }
  .about .about-en { font-size: 54px; color: var(--orange); margin-top: 44px; }
  .about .about-en + h1 { margin-top: 6px; }
  /* 写真のキャプション */
  .photo .photo-cap { position: absolute; left: 0; top: 70px; background: rgba(35,31,28,.82); color: #fff;
                      font-size: 56px; font-weight: 700; letter-spacing: .12em; padding: 22px 56px 22px 60px; }
  .photo .photo-cap span { font-family: "Zen Kaku Gothic New", sans-serif; font-size: 40px; color: var(--orange);
                           letter-spacing: .1em; margin-left: 28px; }
  .photo .photo-cap em { font-style: normal; font-family: "Zen Kaku Gothic New", sans-serif; font-size: 36px;
                         background: var(--orange); color: var(--black); padding: 6px 16px; margin-right: 26px;
                         vertical-align: 8px; letter-spacing: .08em; }
  /* ブランド名 AMANOMA（天の間）を大きく、その下に物件名 */
  .photo .photo-cap { top: 60px; padding: 30px 56px 30px 60px; }
  .photo .photo-cap .brand { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 118px;
                             line-height: 1; letter-spacing: .26em; margin-bottom: 18px; }
  .photo .photo-cap .sub { font-size: 50px; }
  .photo .photo-cap .tagline { font-size: 40px; letter-spacing: .2em; color: #E9DDCD; margin: -2px 0 22px 4px; }
  /* ===== AMANOMA ネイビー×シャンパンゴールド（リッチトーン） ===== */
  :root { --black: #18243A; --ink: #18243A; --taupe: #2C3D5B; --orange: #B89B62; --gold-lt: #D9C394; --ivory: #F6F2EA; }
  html, body { background: var(--ivory); }
  .about { background: var(--ivory); }
  .photo .more { background: rgba(24,36,58,.92); }
  .photo .photo-cap { background: rgba(24,36,58,.86); border-left: 6px solid var(--orange); }
  .photo .photo-cap .tagline { color: #E3D7BE; }
  .photo .photo-cap span { color: var(--gold-lt); }
  .photo .photo-cap em { background: var(--orange); color: var(--black); }
  .works .en { color: var(--gold-lt); }
  .voice .en { color: #CFC3A8; }
  .voice .tag { background: var(--ivory); color: var(--black); }
  .reserve { background: linear-gradient(160deg, #C7AC74 0%, #A88B53 100%); }
  .reserve .en { color: #18243A; opacity: .8; }
  /* 吹き抜けの高窓を見せるため、帯は下・「詳しく見る」は右上へ */
  .photo .photo-cap { top: auto; bottom: 0; padding: 26px 50px 30px 56px; }
  .photo .photo-cap .brand { font-size: 100px; margin-bottom: 12px; }
  .photo .photo-cap .tagline { font-size: 36px; margin-bottom: 16px; }
  .photo .photo-cap .sub { font-size: 46px; }
  .photo .more { top: 44px; bottom: auto; font-size: 46px; padding: 20px 40px 20px 48px; }
  /* ===== 写真を上段いっぱいに（文字はグラデーション越しに重ねる） ===== */
  .top { position: relative; display: block; overflow: hidden; }
  .top .photo { position: absolute; inset: 0; z-index: 1;
                background-size: cover; background-position: center 32%; }
  .top .photo::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(0deg, rgba(24,36,58,.78) 0%, rgba(24,36,58,0) 42%); }
  .top .about { position: absolute; left: 0; top: 0; bottom: 0; width: 1300px; z-index: 2;
    background: linear-gradient(90deg, rgba(24,36,58,.94) 0%, rgba(24,36,58,.82) 55%, rgba(24,36,58,0) 100%); }
  .top .about .logo { height: auto; width: 250px; background: var(--ivory); padding: 16px 24px; border-radius: 4px; }
  .top .about h1 { color: #FFFFFF; }
  .top .about .lead { color: #EDE4D3; }
  .top .about .about-en { color: var(--gold-lt); }
  .photo .photo-cap { left: auto; right: 64px; bottom: 54px; z-index: 3; background: none;
                      border-left: 4px solid var(--orange); padding: 6px 0 6px 40px; }
  .photo .photo-cap .brand { text-shadow: 0 4px 18px rgba(0,0,0,.35); }
  .photo .more { z-index: 3; top: 40px; right: 0; }
  /* 写真は右 1640px に収め、高窓〜ソファまで見せる */
  .top { background: #18243A; }
  .top .photo { left: 860px; background-position: center 45%; }
  .top .about { width: 1180px;
    background: linear-gradient(90deg, #18243A 0%, #18243A 70%, rgba(24,36,58,.6) 84%, rgba(24,36,58,0) 100%); }
  .top .about h1 { font-size: 110px; }
  .top .about .lead { font-size: 58px; }
  .bottom .cell { border-top: 5px solid var(--orange); }
  .top .photo::after { background: linear-gradient(0deg, rgba(24,36,58,.9) 0%, rgba(24,36,58,.55) 30%, rgba(24,36,58,0) 58%); }
  /* 見下ろし写真：ソファとテーブルが中央に来る位置で切り取る */
  .top .photo { background-position: center 46%; }
  .top .photo::after { background: linear-gradient(0deg, rgba(24,36,58,.85) 0%, rgba(24,36,58,.4) 24%, rgba(24,36,58,0) 46%); }
  .photo .photo-cap .brand, .photo .photo-cap .tagline, .photo .photo-cap .sub { text-shadow: 0 2px 12px rgba(0,0,0,.45); }
  .photo .photo-note { position: absolute; z-index: 3; left: 300px; bottom: 58px; color: #fff; font-size: 32px;
                       letter-spacing: .14em; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .photo .photo-note::before { content: ""; display: inline-block; width: 46px; height: 2px; background: var(--gold-lt);
                               vertical-align: middle; margin-right: 18px; }
  .photo .photo-note { left: 230px; top: 44px; bottom: auto; background: rgba(24,36,58,.78); padding: 16px 30px; font-size: 32px; }
</style>
</head>
<body>

  <!-- 1. ハウスワークの家（上段全体が1つのボタン） -->
  <section class="top">
    <div class="about">
      <img class="logo" src="assets/logo_t.png" alt="HOUSE WORK 株式会社ハウスワーク">
      <div class="en about-en">ABOUT US</div>
      <h1 class="mincho">ハウスワークの家</h1>
      <p class="lead">選べるデザイン注文住宅</p>
    </div>
    <div class="photo">
      <div class="photo-note">2階から見下ろす、吹き抜けのLDK</div>
      <div class="photo-cap mincho"><div class="brand">AMANOMA</div><div class="tagline">空とつながる、天の間。</div><div class="sub"><em>新着</em>古河の家<span>オープンルーム</span></div></div>
      <div class="more">詳しく見る
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </div>
  </section>

  <section class="bottom">
    <!-- 2. 建築実例 / 古河展示場 -->
    <div class="cell works">
      <svg class="icon" viewBox="0 0 48 48" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22L24 7l19 15"/><path d="M10 18v23h28V18"/><path d="M20 41V30h8v11"/></svg>
      <div class="en">WORKS</div>
      <h2 class="mincho">建築実例</h2>
      <span class="tag" style="font-family:'Cormorant Garamond',serif;font-weight:600;font-size:54px;letter-spacing:.16em;padding:8px 46px">ROOM TOUR</span>
    </div>

    <!-- 3. 家づくりBOOKプレゼント -->
    <div class="cell voice">
      <svg class="icon" viewBox="0 0 48 48" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="18" width="34" height="23" rx="2"/><path d="M5 12h38v6H5z"/><path d="M24 12v29"/><path d="M24 12c-3-6-11-6-10-1 1 3 7 1 10 1zM24 12c3-6 11-6 10-1-1 3-7 1-10 1z"/></svg>
      <div class="en">CATALOG</div>
      <h2 class="mincho" style="font-size:88px">家づくりBOOK</h2>
      <span class="tag">資料を受け取る</span>
    </div>

    <!-- 4. 見学予約 -->
    <div class="cell reserve">
      <svg class="icon" viewBox="0 0 48 48" fill="none" stroke="#18243A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="10" width="36" height="32" rx="3"/><path d="M6 19h36M15 6v8M33 6v8"/><path d="M17 30l5 5 9-10"/></svg>
      <div class="en">RESERVE</div>
      <h2 class="mincho">見学予約</h2>
      <span class="tag">ご予約はこちら</span>
    </div>
  </section>

</body>
</html>
