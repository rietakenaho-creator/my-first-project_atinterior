<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ハウスワーク リッチメニュー</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* LINE リッチメニュー（大）2500 x 1686px / 上1段 + 下3分割 */
  :root {
    --bg: #F3EEE6;
    --bg-2: #FBF8F3;
    --ink: #3A322B;
    --sub: #7A6E62;
    --line: #D9CFC2;
    --wood: #A9845F;
    --accent: #5E4636;
    --accent-ink: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 2500px; height: 1686px; background: var(--bg); }
  body {
    font-family: "Zen Kaku Gothic New", "IPAGothic", sans-serif;
    color: var(--ink);
    display: grid;
    grid-template-rows: 843px 843px;
  }
  .en { font-family: "Cormorant Garamond", serif; letter-spacing: .18em; color: var(--wood); }
  .mincho { font-family: "Shippori Mincho", "IPAGothic", serif; }

  /* ---- 上段：ハウスワークの家 ---- */
  .top {
    background: var(--bg-2);
    border-bottom: 6px solid var(--line);
    display: grid;
    grid-template-columns: 1240px 1fr;
    column-gap: 60px;
    align-items: center;
    padding: 0 120px;
    position: relative;
  }
  .top .en { font-size: 64px; margin-bottom: 18px; }
  .top h1 { white-space: nowrap; font-size: 148px; font-weight: 700; line-height: 1.1; letter-spacing: .04em; }
  .top .lead { font-size: 60px; color: var(--sub); margin-top: 34px; font-weight: 500; }
  .top .more {
    display: inline-flex; align-items: center; gap: 22px;
    margin-top: 52px; font-size: 54px; font-weight: 700; color: var(--accent);
    border-bottom: 5px solid var(--accent); padding-bottom: 8px;
  }
  .chips { display: grid; grid-template-columns: 1fr; gap: 22px; }
  .chip {
    background: var(--bg);
    border: 4px solid var(--line);
    border-radius: 28px;
    padding: 26px 40px;
    display: flex; align-items: center; gap: 30px;
    font-size: 56px; font-weight: 700; line-height: 1.2; white-space: nowrap;
  }
  .chip svg { flex: 0 0 auto; width: 80px; height: 80px; }
  .chip.wide { grid-column: span 2; }
  .chip small { display: block; font-size: 42px; font-weight: 500; color: var(--sub); margin-top: 6px; }

  /* ---- 下段：3分割 ---- */
  .bottom { display: grid; grid-template-columns: 833px 834px 833px; }
  .cell {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 0;
    border-right: 6px solid var(--line);
  }
  .cell:last-child { border-right: none; }
  .cell svg { width: 210px; height: 210px; margin-bottom: 36px; }
  .cell .en { font-size: 52px; margin-bottom: 10px; }
  .cell h2 { font-size: 112px; font-weight: 700; letter-spacing: .04em; line-height: 1.15; }
  .cell p { font-size: 50px; color: var(--sub); margin-top: 22px; font-weight: 500; line-height: 1.35; }
  .cell .tag {
    display: inline-block; margin-top: 26px; padding: 12px 34px;
    border-radius: 999px; background: var(--wood); color: #fff;
    font-size: 46px; font-weight: 700; letter-spacing: .04em;
  }
  .cell.cta { background: var(--accent); color: var(--accent-ink); }
  .cell.cta .en { color: #E6CDB1; }
  .cell.cta p { color: #F1E6DA; }
  .cell.cta .btn {
    margin-top: 34px; padding: 18px 56px; border-radius: 999px;
    background: #fff; color: var(--accent); font-size: 52px; font-weight: 700;
  }
</style>
</head>
<body>

  <!-- 1. ハウスワークの家 -->
  <section class="top">
    <div>
      <div class="en">ABOUT OUR HOUSE</div>
      <h1 class="mincho">ハウスワークの家</h1>
      <div class="lead">小山市の自由設計・注文住宅</div>
      <div class="more">詳しく見る
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </div>
    <div class="chips">
      <div class="chip">
        <svg viewBox="0 0 48 48" fill="none" stroke="#A9845F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6a12 12 0 0 0-7 21.7V33h14v-5.3A12 12 0 0 0 24 6z"/><path d="M19 38h10M21 43h6"/></svg>
        コンセプト
      </div>
      <div class="chip">
        <svg viewBox="0 0 48 48" fill="none" stroke="#A9845F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 40l6-2 24-24-4-4L10 34z"/><path d="M30 10l4-4 4 4-4 4"/><path d="M8 40h32"/></svg>
        デザインの特徴
      </div>
      <div class="chip">
        <svg viewBox="0 0 48 48" fill="none" stroke="#A9845F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22L24 8l18 14"/><path d="M11 19v21h26V19"/><path d="M20 40V29h8v11"/></svg>
        暮らし方の提案
      </div>
      <div class="chip">
        <svg viewBox="0 0 48 48" fill="none" stroke="#A9845F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 26h32v8H8z"/><path d="M12 26v-6a4 4 0 0 1 4-4h16a4 4 0 0 1 4 4v6"/><path d="M11 34v5M37 34v5"/></svg>
        <span>コーディネートサポート<small>インテリアデザイナーがお手伝い</small></span>
      </div>
    </div>
  </section>

  <section class="bottom">
    <!-- 2. 建築実例 / 古河展示場 -->
    <div class="cell">
      <svg viewBox="0 0 48 48" fill="none" stroke="#A9845F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="9" width="38" height="30" rx="3"/><path d="M5 31l10-9 8 7 6-5 14 11"/><circle cx="33" cy="18" r="3.5"/></svg>
      <div class="en">WORKS</div>
      <h2 class="mincho">建築実例</h2>
      <span class="tag">古河展示場 Room Tour</span>
    </div>

    <!-- 3. お客様の声 -->
    <div class="cell">
      <svg viewBox="0 0 48 48" fill="none" stroke="#A9845F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10h32a3 3 0 0 1 3 3v18a3 3 0 0 1-3 3H22l-9 7v-7H8a3 3 0 0 1-3-3V13a3 3 0 0 1 3-3z"/><path d="M15 20h18M15 26h11"/></svg>
      <div class="en">VOICE</div>
      <h2 class="mincho">お客様の声</h2>
      <p>実際に建てた方の<br>家づくりストーリー</p>
    </div>

    <!-- 4. 見学予約 -->
    <div class="cell cta">
      <svg viewBox="0 0 48 48" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="10" width="36" height="32" rx="3"/><path d="M6 19h36M15 6v8M33 6v8"/><path d="M17 30l5 5 9-10"/></svg>
      <div class="en">RESERVE</div>
      <h2 class="mincho">見学予約</h2>
      <div class="btn">ご予約はこちら</div>
    </div>
  </section>

</body>
</html>
